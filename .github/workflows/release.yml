name: Release

# Two ways in:
#   * push a tag like v1.0.0
#   * Actions tab -> Release -> Run workflow, and type the version
# Both end up building the same set of assets, so a release cut by hand and one
# cut by a tag are indistinguishable afterwards.
#
# Layout: verify once, then build every platform in parallel, then publish. The
# publish job depends on all of the build jobs, so a platform that stops
# compiling fails the run *before* anything is attached to the release - a
# release with a missing or stale asset is worse than a red run.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (must match internal/core/version.go)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve the version
        id: v
        shell: pwsh
        run: |
          $ref = $env:GITHUB_REF
          if ($ref -like 'refs/tags/v*') {
            $ver = $ref.Substring('refs/tags/v'.Length)
          } else {
            $ver = '${{ inputs.version }}'.Trim()
            if ($ver.StartsWith('v')) { $ver = $ver.Substring(1) }
          }
          if ($ver -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must look like 1.0.0 (got '$ver')."
          }
          Write-Host "version: $ver"
          "version=$ver" >> $env:GITHUB_OUTPUT

      # Same guard as release.ps1: a Go binary carries no version resource, so the
      # constant is read out of the source. Bump it before tagging, not after -
      # otherwise the asset silently disagrees with the tag it is attached to.
      - name: Assert internal/core/version.go declares this version
        shell: pwsh
        run: |
          $ver = '${{ steps.v.outputs.version }}'
          $verFile = 'internal\core\version.go'
          if (-not (Test-Path -LiteralPath $verFile)) {
            # Without this, a wrong working directory shows up as a null reference
            # inside [regex]::Match, which reads like a regex bug.
            throw "Not found: $verFile (working directory: $(Get-Location))"
          }
          $m = [regex]::Match((Get-Content -LiteralPath $verFile -Raw), 'Version\s*=\s*"([^"]+)"')
          if (-not $m.Success) { throw "Could not parse a Version constant out of $verFile." }
          $declared = $m.Groups[1].Value
          if ($declared -ne $ver) {
            throw "internal/core/version.go declares '$declared' but this release is '$ver'. Bump the constant first."
          }
          Write-Host "source declares $declared"

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  # Windows legs run on a Windows runner, so the amd64 one can be *executed* and
  # its --dump header read back. That is the strongest check available and it is
  # the platform that ships first.
  windows:
    needs: verify
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: amd64, asset: CodingFire-win-x64 }
          - { goarch: arm64, asset: CodingFire-win-arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        shell: pwsh
        env:
          CGO_ENABLED: '0'
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $env:GOOS   = 'windows'
          $env:GOARCH = '${{ matrix.goarch }}'
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o dist/CodingFire.exe .
          if ($LASTEXITCODE -ne 0) { throw "go build failed (exit $LASTEXITCODE)." }
          Write-Host ("built {0:N0} bytes" -f (Get-Item dist/CodingFire.exe).Length)

      # The assert above proves the *source* declares the right version. This
      # proves the thing we are about to ship agrees. Without it a build that
      # silently failed to replace an existing dist/CodingFire.exe would package
      # the previous version's binary under the new tag.
      #
      # amd64 only: an arm64 exe cannot be executed on the x64 runner.
      - name: Verify the built binary reports this version
        if: matrix.goarch == 'amd64'
        shell: pwsh
        run: |
          $ver = '${{ needs.verify.outputs.version }}'
          $report = Join-Path $env:RUNNER_TEMP 'version-check.txt'
          & 'dist/CodingFire.exe' --dump $report | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "the built binary exited $LASTEXITCODE on --dump." }
          if (-not (Test-Path -LiteralPath $report)) { throw 'the built binary wrote no report.' }
          $head = (Get-Content -LiteralPath $report -TotalCount 1)
          Write-Host "binary reports: $head"
          if ($head -notmatch [regex]::Escape($ver)) {
            throw "the built binary reports '$head', which does not contain '$ver'."
          }

      - name: Package
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $ver = '${{ needs.verify.outputs.version }}'
          $asset = '${{ matrix.asset }}'
          $zip = "$asset-v$ver.zip"
          # One file in the zip, on purpose: "unpack and run" should be literally
          # true, with nothing to keep alongside the binary.
          Compress-Archive -LiteralPath @('dist/CodingFire.exe') -DestinationPath $zip -Force
          Write-Host ("$zip  {0:N0} bytes" -f (Get-Item $zip).Length)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}-v*.zip
          if-no-files-found: error

  # Linux is pure Go (X11 and EGL are reached through xgb + purego, no cgo), so
  # it cross-compiles on any runner. The amd64 leg is then actually run: --dump
  # headlessly, and the GUI under a virtual X server, which is the only place the
  # X11 window layer is exercised.
  linux:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: amd64, asset: CodingFire-linux-x64 }
          - { goarch: arm64, asset: CodingFire-linux-arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags '-s -w' -o dist/CodingFire .
          ls -l dist/CodingFire

      # The virtual display needs the client-side EGL and Mesa's software
      # rasteriser: a GitHub runner has no GPU, and llvmpipe is what the GL
      # backend lands on there.
      - name: Install a virtual X server and a software GL stack
        if: matrix.goarch == 'amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb x11-utils \
            libegl1 libegl-mesa0 libgl1 libglx-mesa0 libgl1-mesa-dri \
            libx11-6 libxext6 libxrandr2 libxcursor1 libxi6

      - name: Smoke test (headless and under Xvfb)
        if: matrix.goarch == 'amd64'
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          chmod +x scripts/linux-smoke.sh
          xvfb-run -a -s "-screen 0 1280x800x24" scripts/linux-smoke.sh dist/CodingFire

      # None of these can be executed on the runner, so they get the two checks
      # that do not need execution: the binary's recorded GOOS/GOARCH must match
      # the label we are about to ship it under, and the version constant must be
      # present in it.
      - name: Verify the binary matches its label and version
        run: |
          ver='${{ needs.verify.outputs.version }}'
          goos='linux'
          goarch='${{ matrix.goarch }}'
          go version -m dist/CodingFire
          if ! go version -m dist/CodingFire | grep -q "GOOS=$goos"; then
            echo "the binary was not built for $goos" >&2; exit 1
          fi
          if ! go version -m dist/CodingFire | grep -q "GOARCH=$goarch"; then
            echo "the binary was not built for $goarch" >&2; exit 1
          fi
          # "CodingFire " + Version is a constant expression, so the compiler
          # folds it and the literal survives -s -w. Scanning for it catches an
          # asset built from a tree whose version constant drifted.
          if ! grep -aqF "CodingFire $ver" dist/CodingFire; then
            echo "the binary does not contain 'CodingFire $ver'" >&2; exit 1
          fi
          echo "ok: $goos/$goarch, reports $ver"

      - name: Package
        run: |
          ver='${{ needs.verify.outputs.version }}'
          asset='${{ matrix.asset }}'
          zip="$asset-v$ver.zip"
          zip -q "$zip" dist/CodingFire
          ls -l "$zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}-v*.zip
          if-no-files-found: error

  # macOS cannot be cross-compiled: the metal backend is cgo, so both legs build
  # on a macOS runner with CGO_ENABLED=1. That is also the only way to get a
  # binary that does not panic on launch - built without cgo, darwin selects
  # gui/backend/run_default.go, whose RunApp panics with "no native backend
  # available".
  macos:
    needs: verify
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: amd64, asset: CodingFire-macos-x64 }
          - { goarch: arm64, asset: CodingFire-macos-arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: '1'
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags '-s -w' -o dist/CodingFire .
          ls -l dist/CodingFire

      # --dump is headless, so unlike the GUI it can be run on the runner. It
      # proves the binary is not merely well-formed but starts and does its job.
      - name: Run the headless report
        run: |
          ./dist/CodingFire --dump "$RUNNER_TEMP/dump.txt"
          head -3 "$RUNNER_TEMP/dump.txt"
          ver='${{ needs.verify.outputs.version }}'
          if ! head -1 "$RUNNER_TEMP/dump.txt" | grep -qF "$ver"; then
            echo "the report does not name version $ver" >&2; exit 1
          fi

      - name: Verify the binary matches its label and version
        run: |
          ver='${{ needs.verify.outputs.version }}'
          goos='darwin'
          goarch='${{ matrix.goarch }}'
          go version -m dist/CodingFire
          if ! go version -m dist/CodingFire | grep -q "GOOS=$goos"; then
            echo "the binary was not built for $goos" >&2; exit 1
          fi
          if ! go version -m dist/CodingFire | grep -q "GOARCH=$goarch"; then
            echo "the binary was not built for $goarch" >&2; exit 1
          fi
          if ! grep -aqF "CodingFire $ver" dist/CodingFire; then
            echo "the binary does not contain 'CodingFire $ver'" >&2; exit 1
          fi
          echo "ok: $goos/$goarch, reports $ver"

      - name: Package
        run: |
          ver='${{ needs.verify.outputs.version }}'
          asset='${{ matrix.asset }}'
          zip="$asset-v$ver.zip"
          zip -q "$zip" dist/CodingFire
          ls -l "$zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}-v*.zip
          if-no-files-found: error

  publish:
    needs: [verify, windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download every built asset
        uses: actions/download-artifact@v4
        with:
          pattern: CodingFire-*
          merge-multiple: true
          path: assets

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # This job never checks the repo out - it only needs the downloaded
          # zips - so gh cannot infer the repository from the working directory.
          # Without -R every gh call dies with "fatal: not a git repository".
          $repo = '${{ github.repository }}'
          $ver = '${{ needs.verify.outputs.version }}'
          $tag = "v$ver"
          $zips = @(Get-ChildItem -Path assets -Filter *.zip | Sort-Object Name | ForEach-Object { $_.FullName })
          if ($zips.Count -eq 0) { throw 'no assets were built.' }
          Write-Host "publishing $($zips.Count) asset(s):"
          $zips | ForEach-Object { Write-Host ("  " + (Split-Path $_ -Leaf)) }

          # The asset list is generated rather than written out, so the notes can
          # never advertise a platform that failed to build. It is joined into a
          # single string first: as a bare array element inside the @() literal it
          # survives as one object and -join renders it as "System.Object[]".
          $bullets = (($zips | ForEach-Object { '- `' + (Split-Path $_ -Leaf) + '`' }) -join "`n")
          $notes = @(
            'CodingFire - a campfire overlay that shows how hard your local AI tools are working.',
            '',
            'Assets:',
            $bullets,
            '',
            '**Windows 10 and later** is the most thoroughly exercised target; the x64 zip is',
            'the one to pick there. The Windows build needs nothing installed.',
            '',
            '**Linux** needs an X11 session with a compositing manager (for the transparent',
            'window) and a StatusNotifier host for the tray - KDE, XFCE and LXQt all have one,',
            'and GNOME needs an extension. The zip holds a single static binary.',
            '',
            '**macOS** is built with the native Metal backend and provides a menu-bar item.',
            'The download is not code-signed, so Gatekeeper needs it allowed once under',
            'System Settings > Privacy & Security.',
            '',
            'The [C#/.NET build](https://github.com/wangsrGit119/codingfire-win) remains the',
            'choice for Windows 7 and 8; this one trades that range for a self-contained',
            'binary and no .NET dependency.'
          ) -join "`n"

          gh release view $tag -R $repo 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "release $tag already exists - replacing assets"
            gh release upload $tag $zips -R $repo --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed (exit $LASTEXITCODE)." }
            # Notes are regenerated on every run, so re-running the workflow after
            # adding a platform cannot leave the old platform list behind.
            gh release edit $tag -R $repo --title "CodingFire $tag" --notes $notes
          } else {
            gh release create $tag $zips -R $repo --title "CodingFire $tag" --notes $notes --target $env:GITHUB_SHA
          }
          if ($LASTEXITCODE -ne 0) { throw "gh failed (exit $LASTEXITCODE)." }
          Write-Host "published $tag"
